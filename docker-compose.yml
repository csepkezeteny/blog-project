version: '3.8'

services:
  backend:
    build: ./backend
    container_name: blog-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/blog.db
    volumes:
      - db-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: blog-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
