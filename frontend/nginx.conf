server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API kérések továbbítása a backendnek
    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    # SPA routing: minden route-ot az index.html-re irányít
    location / {
        try_files $uri $uri/ /index.html;
    }
}
